<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floresta Encantada ✨</title>
  
  <!-- Fontes de Livro de Contos de Fadas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Tangerine:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-bright: #ffe8a3;
      --gold-main: #d4af37;
      --gold-dark: #8c6d1f;
      --parchment: #fdf8eb;
      --ink: #2a180c;
      --ruby: #8b1e1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      color: #fdf8eb;
      overflow-x: hidden;
      position: relative;
      background-color: #050d09;
    }

    /* === CAMADA DE CENÁRIO (ILUSTRAÇÕES DE ARTE EM HD) === */
    .bg-art-layer {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1.2s ease-in-out;
      filter: brightness(0.88) contrast(1.08);
    }

    /* Vinheta e Iluminação de Ilusão de Livro */
    .vignette-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 35%, rgba(4, 10, 7, 0.55) 75%, rgba(2, 5, 3, 0.92) 100%);
    }

    /* Moldura Dourada de Livro de Princesa */
    .storybook-frame {
      position: fixed;
      top: 14px; left: 14px; right: 14px; bottom: 14px;
      border: 2px solid rgba(212, 175, 55, 0.85);
      border-radius: 18px;
      pointer-events: none;
      z-index: 50;
      box-shadow: inset 0 0 25px rgba(212, 175, 55, 0.3), 0 0 20px rgba(0,0,0,0.9);
    }

    .storybook-frame::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px dashed rgba(255, 232, 163, 0.4);
      border-radius: 14px;
    }

    /* Canvas para Pó de Fada */
    #fairyDustCanvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    /* Container Principal */
    .app-container {
      width: 92%;
      max-width: 660px;
      margin: 20px auto;
      position: relative;
      z-index: 30;
      text-align: center;
    }

    header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.6rem;
      color: var(--gold-bright);
      text-shadow: 0 0 20px rgba(255, 232, 163, 0.8), 0 3px 6px rgba(0,0,0,0.95);
      letter-spacing: 3px;
    }

    header p {
      font-style: italic;
      font-size: 1.25rem;
      color: #ffeaa8;
      text-shadow: 0 2px 4px rgba(0,0,0,0.95);
      margin-top: 4px;
      margin-bottom: 22px;
    }

    /* Seletor de Cenários */
    .theme-selector {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .theme-btn {
      background: rgba(10, 22, 15, 0.82);
      border: 1.5px solid var(--gold-main);
      color: var(--gold-bright);
      padding: 9px 18px;
      border-radius: 20px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.7);
      transition: all 0.3s;
    }

    .theme-btn:hover, .theme-btn.active {
      background: linear-gradient(180deg, #ffe8a3 0%, #c8961e 100%);
      color: #1a0f02;
      font-weight: bold;
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 232, 163, 0.9);
      transform: translateY(-2px);
    }

    /* Pergaminho Mágico */
    .parchment-card {
      background: radial-gradient(circle at center, #fdfbf7 0%, #f3e5c8 100%);
      border: 4px double var(--gold-dark);
      border-radius: 16px;
      padding: 32px 28px 22px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 60px rgba(140, 109, 31, 0.22);
      position: relative;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
    }

    .parchment-card::before { content: '⚜️'; position: absolute; top: 12px; left: 16px; color: var(--gold-dark); font-size: 16px; }
    .parchment-card::after { content: '⚜️'; position: absolute; top: 12px; right: 16px; color: var(--gold-dark); font-size: 16px; }

    .parchment-card.sending {
      transform: translateY(-130px) scale(0.1) rotate(20deg);
      opacity: 0;
    }

    textarea {
      width: 100%;
      height: 195px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      font-family: 'Tangerine', cursive;
      font-size: 2.6rem;
      line-height: 1.25;
      font-weight: bold;
      resize: none;
    }

    textarea::placeholder {
      color: rgba(42, 24, 12, 0.45);
      font-style: italic;
    }

    .btn-send {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: linear-gradient(180deg, #ffe8a3 0%, #c8961e 100%);
      border: 1px solid #fff3c4;
      color: #1a0f02;
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0,0,0,0.7), 0 0 15px rgba(212, 175, 55, 0.5);
      transition: all 0.3s;
    }

    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 232, 163, 0.95);
    }

    /* Flor Mágica Sundrop Lily Ilustrada (SVG Bioluminescente) */
    .magic-flower-corner {
      position: fixed;
      bottom: 22px;
      left: 22px;
      z-index: 25;
      pointer-events: none;
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.9));
      animation: flowerPulse 3.8s infinite alternate ease-in-out;
    }

    @keyframes flowerPulse {
      0% { transform: scale(0.95) rotate(-2deg); filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.7)); }
      100% { transform: scale(1.06) rotate(2deg); filter: drop-shadow(0 0 28px rgba(255, 215, 0, 1)) drop-shadow(0 0 42px rgba(255, 120, 180, 0.75)); }
    }

    /* Baú do Tesouro no Canto Direito */
    .chest-corner {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 35;
    }

    .chest-btn {
      background: linear-gradient(180deg, rgba(16, 32, 22, 0.94) 0%, rgba(4, 10, 7, 0.94) 100%);
      border: 1.5px solid var(--gold-main);
      color: var(--gold-bright);
      padding: 10px 18px;
      border-radius: 25px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.85), 0 0 14px rgba(212, 175, 55, 0.4);
      transition: all 0.3s;
    }

    .chest-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(255, 232, 163, 0.9);
    }

    /* Modal do Baú */
    .vault-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(4, 10, 7, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .vault-card {
      background: #0a1811;
      border: 2px solid var(--gold-main);
      border-radius: 16px;
      width: 90%;
      max-width: 520px;
      max-height: 80vh;
      padding: 24px;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
      display: flex;
      flex-direction: column;
    }

    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--gold-main);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .vault-header h2 { font-family: 'Cinzel Decorative', serif; color: var(--gold-bright); font-size: 1.3rem; }
    .close-btn { background: transparent; border: none; color: var(--gold-bright); font-size: 1.8rem; cursor: pointer; }
    .vault-content { overflow-y: auto; padding-right: 5px; }

    .wish-item {
      background: var(--parchment);
      color: var(--ink);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      text-align: left;
      border-left: 5px solid var(--ruby);
      position: relative;
    }

    .wax-seal {
      position: absolute;
      top: 10px; right: 12px;
      width: 26px; height: 26px;
      background: var(--ruby);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #ffd700; font-size: 12px;
    }

    .wish-date { font-size: 0.85rem; color: #7a5c38; font-weight: bold; margin-bottom: 4px; }
    .wish-text { font-family: 'Tangerine', cursive; font-size: 2.1rem; line-height: 1.2; font-weight: bold; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      .magic-flower-corner { transform: scale(0.68); left: -8px; bottom: 0px; }
      .chest-corner { right: 12px; bottom: 12px; }
      .chest-btn { font-size: 0.9rem; padding: 8px 14px; }
    }
  </style>
</head>
<body>

  <!-- Camada de Ilustração de Fundo -->
  <div class="bg-art-layer" id="bgArtLayer"></div>
  <div class="vignette-overlay"></div>
  <div class="storybook-frame"></div>
  
  <canvas id="fairyDustCanvas"></canvas>

  <!-- Flor Mágica Sundrop Lily (Vetor Rico e Iluminado) -->
  <div class="magic-flower-corner">
    <svg width="120" height="130" viewBox="0 0 100 110">
      <defs>
        <radialGradient id="sunGold" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="30%" stop-color="#fff066" />
          <stop offset="70%" stop-color="#ff9900" />
          <stop offset="100%" stop-color="#cc5500" />
        </radialGradient>
        <filter id="glowEffect">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <!-- Haste e Folhas -->
      <path d="M 50 105 Q 40 80 50 55" stroke="#235e2e" stroke-width="5" fill="none" />
      <path d="M 47 85 Q 20 75 28 95 Q 44 90 47 85" fill="#328241" />
      <path d="M 50 75 Q 75 65 72 85 Q 54 82 50 75" fill="#328241" />
      
      <!-- Pétalas em Camadas -->
      <g filter="url(#glowEffect)">
        <path d="M 50 55 C 20 10 0 32 36 48 Z" fill="url(#sunGold)" />
        <path d="M 50 55 C 80 10 100 32 64 48 Z" fill="url(#sunGold)" />
        <path d="M 50 55 C 10 48 10 88 42 62 Z" fill="url(#sunGold)" />
        <path d="M 50 55 C 90 48 90 88 58 62 Z" fill="url(#sunGold)" />
        <path d="M 50 55 C 36 0 64 0 50 48 Z" fill="url(#sunGold)" />
        <!-- Miolo Brilhante -->
        <circle cx="50" cy="52" r="8" fill="#ffffff" />
        <circle cx="50" cy="52" r="5" fill="#fff599" />
      </g>
    </svg>
  </div>

  <!-- Aplicação Principal -->
  <div class="app-container">
    <header>
      <h1>FLORESTA ENCANTADA</h1>
      <p>Escreva para o Universo e envie com mágica...</p>
    </header>

    <!-- Troca de Cenários -->
    <div class="theme-selector">
      <button class="theme-btn active" onclick="setTheme('aurora', this)">Clareira da Aurora</button>
      <button class="theme-btn" onclick="setTheme('cottage', this)">Cabana das Fadas</button>
      <button class="theme-btn" onclick="setTheme('tinker', this)">Refúgio de Tinker Bell</button>
      <button class="theme-btn" onclick="setTheme('paris', this)">Noite em Paris</button>
    </div>

    <!-- Pergaminho de Escrita -->
    <div class="parchment-card" id="parchmentCard">
      <textarea id="wishText" placeholder="Querido Universo... escreva aqui seus desejos mais sinceros"></textarea>
      <button class="btn-send" onclick="sendWish()">Enviar ao Universo ✨</button>
    </div>
  </div>

  <!-- Baú das Cartas -->
  <div class="chest-corner">
    <button class="chest-btn" onclick="toggleVault()">
      <span>👑 Baú das Cartas</span>
      <span style="background: var(--gold-main); color: #000; border-radius: 10px; padding: 2px 8px; font-size: 0.8rem;" id="wishCount">0</span>
    </button>
  </div>

  <!-- Modal do Baú -->
  <div class="vault-modal" id="vaultModal">
    <div class="vault-card">
      <div class="vault-header">
        <h2>👑 Baú dos Desejos Guardados</h2>
        <button class="close-btn" onclick="toggleVault()">&times;</button>
      </div>
      <div class="vault-content" id="vaultList"></div>
    </div>
  </div>

  <script>
    /* ARTWORKS DE CENÁRIOS DE ALTA RESOLUÇÃO */
    const artworks = {
      aurora: "https://images.unsplash.com/photo-1511497584788-876761c11969?q=80&w=2000&auto=format&fit=crop",
      cottage: "https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?q=80&w=2000&auto=format&fit=crop",
      tinker: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop",
      paris: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=2000&auto=format&fit=crop"
    };

    const bgLayer = document.getElementById('bgArtLayer');

    function setTheme(key, btn) {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      bgLayer.style.backgroundImage = `url('${artworks[key]}')`;
    }

    // Inicializa no cenário da Clareira da Aurora
    setTheme('aurora', document.querySelector('.theme-btn.active'));

    // CANVAS DE PÓ DE FADA
    const canvas = document.getElementById('fairyDustCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    setInterval(() => {
      if (particles.length < 60) {
        particles.push({
          x: Math.random() * canvas.width,
          y: canvas.height + 10,
          size: Math.random() * 3 + 1,
          speedX: (Math.random() - 0.5) * 1.2,
          speedY: -(Math.random() * 1.8 + 0.8),
          color: `hsl(${Math.random() * 45 + 40}, 100%, 80%)`,
          life: 1
        });
      }
    }, 110);

    function createMagicBurst(x, y) {
      for (let i = 0; i < 65; i++) {
        particles.push({
          x: x, y: y,
          size: Math.random() * 5.5 + 1.5,
          speedX: (Math.random() - 0.5) * 8.5,
          speedY: (Math.random() - 0.5) * 8.5 - 2,
          color: `hsl(${Math.random() * 55 + 35}, 100%, 80%)`,
          life: 1
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.life -= 0.012;
        
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) particles.splice(index, 1);
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ÁUDIO MÁGICO
    function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audio = new AudioCtx();
        const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        freqs.forEach((f, i) => {
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, audio.currentTime + i * 0.07);
          gain.gain.setValueAtTime(0.12, audio.currentTime + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + i * 0.07 + 0.5);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(audio.currentTime + i * 0.07);
          osc.stop(audio.currentTime + i * 0.07 + 0.5);
        });
      } catch(e) {}
    }

    // ENVIAR E SALVAR DESEJO
    function sendWish() {
      const input = document.getElementById('wishText');
      const text = input.value.trim();
      
      if (!text) {
        alert("Escreva seu desejo no pergaminho antes de enviar ao universo!");
        return;
      }

      const card = document.getElementById('parchmentCard');
      const rect = card.getBoundingClientRect();
      
      playChime();
      createMagicBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

      card.classList.add('sending');

      setTimeout(() => {
        saveWish(text);
        input.value = '';
        card.classList.remove('sending');
        updateVault();
      }, 850);
    }

    function saveWish(text) {
      const wishes = JSON.parse(localStorage.getItem('my_wishes') || '[]');
      wishes.push({
        id: Date.now(),
        date: new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }),
        text: text
      });
      localStorage.setItem('my_wishes', JSON.stringify(wishes));
    }

    function updateVault() {
      const wishes = JSON.parse(localStorage.getItem('my_wishes') || '[]');
      document.getElementById('wishCount').innerText = wishes.length;
      
      const list = document.getElementById('vaultList');
      if (wishes.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: #ffeaa8; font-style: italic; margin: 20px 0;">O baú ainda está vazio... Envie seu primeiro desejo!</p>';
        return;
      }

      list.innerHTML = wishes.map(w => `
        <div class="wish-item">
          <div class="wax-seal">✦</div>
          <div class="wish-date">📜 Enviado em ${w.date}</div>
          <div class="wish-text">${w.text}</div>
        </div>
      `).reverse().join('');
    }

    function toggleVault() {
      const vault = document.getElementById('vaultModal');
      vault.style.display = vault.style.display === 'flex' ? 'none' : 'flex';
    }

    updateVault();
  </script>
</body>
</html>
